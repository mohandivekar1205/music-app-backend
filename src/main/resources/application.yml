spring:
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require&currentSchema=${DB_SCHEMA:music_app}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_SCHEMA:music_app}
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:music_app}
    create-schemas: true
    baseline-on-migrate: true
server:
  port: ${SERVER_PORT:8080}
streaming-service:
  base-url: ${STREAMING_SERVICE_URL:http://localhost:8081}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
