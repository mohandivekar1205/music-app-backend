# Import .env configuration
spring.config.import=optional:file:.env[.properties]

# Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require&currentSchema=${DB_SCHEMA:music_app}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:music_app}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.schemas=${DB_SCHEMA:music_app}
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true

# Server Configuration
server.port=${SERVER_PORT:8080}

# External Services
streaming-service.base-url=${STREAMING_SERVICE_URL:http://localhost:8081}

# SpringDoc OpenAPI Swagger
springdoc.swagger-ui.path=/swagger-ui.html
