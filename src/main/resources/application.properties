# Import .env configuration
spring.config.import=optional:file:.env[.properties]

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require&currentSchema=${DB_SCHEMA:music_app}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:music_app}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.schemas=${DB_SCHEMA:music_app}
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true

# Server Configuration
server.port=${SERVER_PORT:8080}

# External Services
streaming-service.base-url=${STREAMING_SERVICE_URL:http://localhost:8081}

# Supabase Storage Configuration
supabase.url=${SUPABASE_URL:${supabase.url}}
supabase.storage.bucket=${supabase.storage.bucket:${SUPABASE_STORAGE_BUCKET}}
supabase.secret-key=${supabase.secret-key:${SUPABASE_SECRET_KEY:}}

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=${spring.servlet.multipart.max-file-size:10MB}
spring.servlet.multipart.max-request-size=${spring.servlet.multipart.max-request-size:12MB}

# SpringDoc OpenAPI Swagger
springdoc.swagger-ui.path=/swagger-ui.html
